<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>数学素养训练工具箱</title>
<style>
:root{
  --ink:#17324d;
  --muted:#6d7f92;
  --line:#dbe6ef;
  --paper:#fffefb;
  --bg:#edf4f7;
  --blue:#3978d8;
  --blue-soft:#eaf2ff;
  --teal:#1f9a8a;
  --teal-soft:#e9f8f4;
  --yellow:#e6a925;
  --yellow-soft:#fff6d8;
  --orange:#ef7b45;
  --orange-soft:#fff0e8;
  --purple:#7657c8;
  --purple-soft:#f1edff;
  --shadow:0 16px 40px rgba(33,68,98,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:#fff;padding:22px 18px 18px;border-right:1px solid #dce7ef;overflow:auto}
.side-head{padding:2px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.side-kicker{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--blue);margin-bottom:6px}
.side-title{margin:0;font-size:21px;line-height:1.25}
.side-sub{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:6px}
.module-list{display:grid;gap:11px}
.module{border:1px solid var(--line);border-radius:16px;background:#fbfdff;padding:12px}
.module-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.module-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;font-weight:900}
.module:nth-child(1) .module-icon{background:var(--yellow-soft)}
.module:nth-child(2) .module-icon{background:var(--blue-soft)}
.module:nth-child(3) .module-icon{background:var(--teal-soft)}
.module:nth-child(4) .module-icon{background:var(--purple-soft)}
.module-code{font-size:10px;font-weight:900;color:#8794a4;letter-spacing:.08em}
.module-name{font-size:13px;font-weight:900;margin-top:1px}
.tool-option{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;border-radius:12px;padding:8px 9px;margin-top:5px;transition:.15s ease;cursor:pointer}
.tool-option:hover{background:#f5f8fb}
.tool-option input{display:none}
.tool-picto{width:32px;height:32px;border-radius:10px;background:#eef3f8;display:grid;place-items:center;font-weight:900;font-size:13px;color:#48637c;border:1px solid #e0e8ef}
.tool-text{font-size:12px;font-weight:800;line-height:1.35}
.checkmark{width:21px;height:21px;border:2px solid #b8c6d3;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900;transition:.15s ease}
.tool-option:has(input:checked){background:#f2f7ff}
.tool-option input:checked ~ .checkmark{background:var(--blue);border-color:var(--blue)}
.tool-option input:checked ~ .checkmark::before{content:"✓"}
.selection-note{margin:13px 3px 0;font-size:11px;color:var(--muted);line-height:1.5}
.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.side-actions button{border:0;border-radius:11px;padding:10px 9px;font-size:12px;font-weight:900}
.btn-soft{background:#eef3f8;color:#38536c}.btn-main{background:var(--blue);color:#fff}.btn-print{grid-column:1/-1;background:#17324d;color:#fff}

.workspace{padding:24px 28px 50px;overflow:auto}
.workspace-head{max-width:960px;margin:0 auto 16px;display:flex;justify-content:space-between;gap:20px;align-items:end}
.workspace-head h2{margin:0;font-size:21px}.workspace-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.counter{font-size:12px;font-weight:900;color:var(--blue);background:#fff;border:1px solid var(--line);padding:8px 11px;border-radius:999px}
.pages{display:grid;gap:24px}
.empty-state{width:min(100%,900px);margin:50px auto;background:#fff;border:1px dashed #c4d2df;border-radius:20px;padding:45px 24px;text-align:center;color:var(--muted)}
.empty-state .big{font-size:40px;margin-bottom:8px}.empty-state strong{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}

.page{width:min(100%,900px);height:1272px;margin:0 auto;background:var(--paper);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;position:relative;padding:34px 42px 28px;display:flex;flex-direction:column;border:1px solid rgba(219,230,239,.8)}
.page::before{content:"";position:absolute;inset:0 0 auto 0;height:150px;background:linear-gradient(135deg,rgba(57,120,216,.11),rgba(31,154,138,.06),rgba(230,169,37,.08));pointer-events:none}
.page::after{content:"";position:absolute;left:0;right:0;top:150px;bottom:0;opacity:.32;pointer-events:none;background-image:radial-gradient(#d6e2ea 1px, transparent 1px);background-size:18px 18px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.12),transparent 36%)}
.page>*{position:relative;z-index:1}
.page-head{padding-bottom:16px;border-bottom:2px solid #24455f}
.page-tag{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:900;color:var(--blue);letter-spacing:.08em;margin-bottom:7px}.dot{width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.page-title{margin:0;font-size:29px;line-height:1.16}.page-subtitle{margin-top:7px;font-size:12.5px;color:var(--muted);font-weight:700}

.content-grid{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) 24%;gap:14px;padding-top:15px}
.block{border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.94);overflow:hidden}
.block-head{display:flex;align-items:center;gap:10px;padding:11px 14px 8px}
.block-num{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:950}
.flow-block .block-num{background:var(--orange)}.write-block .block-num{background:var(--teal)}.check-block .block-num{background:var(--purple)}
.block-title{font-size:14px;font-weight:950}.block-note{font-size:10.5px;color:var(--muted);margin-left:auto}

.flow-block{padding-bottom:12px}
.flow-track{display:flex;align-items:stretch;gap:7px;padding:2px 13px 0;overflow-x:auto}
.flow-step{min-width:0;flex:1;border-radius:13px;background:#fff7ee;border:1px solid #f6dcc9;padding:10px 10px 9px;display:flex;gap:8px;align-items:flex-start}
.flow-step .n{width:23px;height:23px;flex:0 0 23px;border-radius:8px;background:#fff;border:1px solid #f1cfb6;display:grid;place-items:center;font-size:10px;font-weight:950;color:var(--orange)}
.flow-step .t{font-size:11.5px;line-height:1.45;font-weight:800;color:#3c4e60}.arrow{align-self:center;color:#d6a17e;font-weight:900}

.write-block{display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,#ffffff,#fcfffe)}
.write-body{flex:1;min-height:0;padding:2px 14px 14px;display:grid;grid-template-rows:42% 58%;gap:10px}
.write-card{min-height:0;border:1px solid #dce9e6;background:#fbfffe;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.write-label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:950;margin-bottom:5px}.pencil{font-size:14px}.hint{font-size:10.5px;color:var(--muted);margin-bottom:7px}
textarea,.line-input{width:100%;border:0;outline:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 28px,#dbe7e5 29px);color:var(--ink);font-size:13px;line-height:29px;padding:0 4px;resize:none}
textarea{flex:1;min-height:0}.example-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;flex:1;min-height:0;align-content:stretch}.example-field{border-radius:12px;border:1px solid #dce9e6;background:#fff;padding:8px 9px;display:flex;flex-direction:column;min-height:0}.example-field.wide{grid-column:1/-1}.example-field label{font-size:10.5px;font-weight:900;color:#4e6a66;margin-bottom:4px}.example-field textarea{font-size:12px;line-height:25px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 24px,#e0ebe8 25px)}

.check-block{display:flex;flex-direction:column;background:linear-gradient(135deg,#faf8ff,#ffffff)}
.check-inner{flex:1;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:10px;padding:2px 14px 11px;min-height:0}
.check-left{display:grid;gap:7px;align-content:center;min-width:0}
.check-item{display:grid;grid-template-columns:28px 1fr;align-items:center;gap:9px;border-radius:12px;background:#fff;border:1px solid #e7e1f6;padding:9px 11px;cursor:pointer}
.check-item input{display:none}.check-box{width:24px;height:24px;border:2px solid #baaed8;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:900}.check-item input:checked + .check-box{background:var(--purple);border-color:var(--purple)}.check-item input:checked + .check-box::before{content:"✓"}.check-text{font-size:11.5px;font-weight:800;line-height:1.4}
.reflection-box{border:1px solid #e7e1f6;border-radius:12px;background:#fff;padding:9px 11px;display:flex;flex-direction:column;min-height:0}
.reflection-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:950;color:#6c5c93;margin-bottom:5px}.reflection-label::before{content:"✎";font-size:13px;color:var(--purple)}
.reflection-box textarea{flex:1;min-height:72px;font-size:11.5px;line-height:24px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 23px,#e7e1f6 24px)}
.footer-note{margin-top:10px;display:flex;justify-content:space-between;align-items:center;color:#8a98a8;font-size:9.5px}.footer-note strong{color:#496579;font-size:10px}


.mindmap-page .content-grid{grid-template-rows:auto minmax(0,1fr)}
.mindmap-example{padding:2px 14px 14px;display:grid;grid-template-columns:1fr;gap:12px;align-items:center;justify-items:center;text-align:left}
.mindmap-example .example-copy{font-size:12px;line-height:1.7;color:#3c4e60;font-weight:800}
.mindmap-example img{width:100%;max-width:700px;height:250px;object-fit:contain;border-radius:13px;border:1px solid #dce9e6;background:#fff;display:block;margin:0 auto}
.draw-block{display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,#ffffff,#fcfffe)}
.draw-area{flex:1;min-height:0;margin:2px 14px 14px;border:2px dashed #b7d8d1;border-radius:16px;background-color:#fff;
  background-image:radial-gradient(#d5e7e3 1px,transparent 1px);background-size:18px 18px;position:relative}
.draw-area::after{content:'从中心主题开始，在这里画我的知识导图';position:absolute;inset:0;display:grid;place-items:center;color:#9ab0ab;font-size:14px;font-weight:800;letter-spacing:.04em;pointer-events:none}
.mini-flow-note{padding:0 14px 10px;font-size:10.5px;color:var(--muted);font-weight:700}
@media(max-width:620px){.mindmap-example img{height:220px}.draw-area{min-height:520px}}
@media print{.mindmap-page .content-grid{grid-template-rows:auto minmax(0,1fr)}.mindmap-example img{height:56mm;max-width:150mm}.draw-area::after{font-size:11pt}}



.cognition-page .content-grid{grid-template-rows:minmax(0,1fr) 15%;gap:12px}
.cognition-write-block,.cognition-reflect-block{display:flex;flex-direction:column;min-height:0}
.cognition-write-block{background:linear-gradient(180deg,#ffffff,#fcfffe)}
.cognition-reflect-block{background:linear-gradient(135deg,#faf8ff,#ffffff)}
.cognition-write-block .block-num{background:var(--teal)}
.cognition-reflect-block .block-num{background:var(--purple)}
.cognition-topic-grid{flex:1;min-height:0;display:grid;gap:10px;padding:2px 14px 14px}
.cognition-topic-grid.three{grid-template-rows:repeat(3,minmax(0,1fr))}
.cognition-topic-grid.two{grid-template-rows:repeat(2,minmax(0,1fr))}
.cognition-topic{border:1px solid #dce9e6;background:#fbfffe;border-radius:14px;padding:11px 12px;display:grid;grid-template-columns:36% minmax(0,1fr);gap:12px;min-height:0}
.cognition-topic-copy{min-width:0}
.cognition-topic-no{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:9px;background:var(--teal-soft);color:var(--teal);font-size:12px;font-weight:950;margin-bottom:7px}
.cognition-topic-title{font-size:12.5px;font-weight:950;line-height:1.5;margin-bottom:5px}
.cognition-topic-desc{font-size:10.5px;color:var(--muted);line-height:1.65}
.cognition-topic textarea{min-height:0;height:100%;font-size:12px;line-height:26px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,#dbe7e5 26px)}
.cognition-reflect-body{flex:1;min-height:0;padding:2px 14px 14px}
.cognition-reflect-body textarea{height:100%;min-height:0;border:1px solid #e7e1f6;border-radius:13px;padding:6px 10px;font-size:12px;line-height:27px;background:repeating-linear-gradient(to bottom,#fff 0,#fff 26px,#e7e1f6 27px)}


.checklist-page .content-grid{grid-template-rows:minmax(0,1fr);gap:14px}
.management-block{display:flex;flex-direction:column;min-height:0;background:linear-gradient(135deg,#faf8ff,#ffffff)}
.management-block .block-num{background:var(--purple)}
.management-checks{flex:1;min-height:0;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:12px;padding:8px 14px 16px}
.management-check{display:grid;grid-template-columns:58px 1fr auto;gap:15px;align-items:center;border:1px solid #e7e1f6;border-radius:16px;background:#fff;padding:15px 18px;cursor:pointer}
.management-check input{display:none}
.management-box{width:46px;height:46px;border:2px solid #baaed8;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:25px;font-weight:950}
.management-check input:checked + .management-box{background:var(--purple);border-color:var(--purple)}
.management-check input:checked + .management-box::before{content:"✓"}
.management-name{font-size:18px;font-weight:950;letter-spacing:.03em}
.management-status{font-size:11px;color:var(--muted);font-weight:800}
.management-check:has(input:checked){background:#faf8ff;border-color:#d8cff0}
.management-check:has(input:checked) .management-status{color:var(--purple)}
@media(max-width:620px){
  .cognition-topic{grid-template-columns:1fr}
  .cognition-topic-copy{padding-bottom:2px}
  .cognition-topic textarea{min-height:120px}
}
@media print{
  .cognition-page .content-grid{grid-template-rows:minmax(0,1fr) 15%}
  .management-name{font-size:15pt}
}

@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.workspace{padding:18px 10px 30px}.module-list{grid-template-columns:repeat(2,minmax(0,1fr))}.page{height:auto;min-height:1100px;padding:28px 22px}.content-grid{grid-template-rows:auto minmax(580px,1fr) auto}.check-block{min-height:220px}.example-grid{grid-template-columns:1fr}.example-field.wide{grid-column:auto}}
@media(max-width:620px){.module-list{grid-template-columns:1fr}.workspace-head{align-items:start;flex-direction:column}.page-title{font-size:24px}.flow-track{display:grid;grid-template-columns:1fr 1fr}.arrow{display:none}.write-body{grid-template-rows:auto auto}.write-card{min-height:220px}.example-grid{display:grid}.check-inner{grid-template-columns:1fr}.reflection-box{min-height:130px}}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff;width:210mm}
  .sidebar,.workspace-head,.empty-state{display:none!important}
  .app,.workspace,.pages{display:block!important;padding:0!important;margin:0!important}
  .page{width:210mm;height:297mm;min-height:297mm;margin:0;border:0;border-radius:0;box-shadow:none;padding:12mm 14mm 10mm;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
  .page::before{height:34mm}.content-grid{grid-template-rows:auto minmax(0,1fr) 24%}
  textarea{resize:none}
}
</style>
<link rel="stylesheet" href="/ps-shell.css"><script src="/ps-report.js"></script><script src="/ps-shell.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="side-head">
      <div class="side-kicker">04｜配置训练工具</div>
      <h1 class="side-title">勾选数学素养训练的工具组合</h1>
    </div>
    <div class="module-list" id="moduleList"></div>
    <div class="selection-note" id="selectionNote"></div>
    <div class="side-actions">
      <button class="btn-soft" id="selectAllBtn">全选</button>
      <button class="btn-soft" id="clearSelectBtn">清空</button>
      <button class="btn-print" onclick="window.print()">打印所选工具卡</button>
    </div>
  </aside>

  <main class="workspace">
    <div class="workspace-head">
      <div>
        <h2>我的学习工具箱 · 数学素养训练</h2>
      </div>
      <div class="counter" id="counter">已选 0 个工具</div>
    </div>
    <div class="pages" id="pages"></div>
  </main>
</div>

<script>
const GROUPS=[
  {code:'MODULE A',name:'认知与规律',icon:'🧠',tools:['cognition-reflection']},
  {code:'MODULE B',name:'支点与核心',icon:'🧩',tools:['wake-thinking','mindmap-method','point-point','point-face','three-level']},
  {code:'MODULE C',name:'技术与方法',icon:'🛠️',tools:['three-say-five-step','four-question','solve-three']},
  {code:'MODULE D',name:'规划与管理',icon:'🗂️',tools:['management-checklist']}
];

const TOOLS=[
  {
    id:'cognition-reflection',num:'01—05',title:'认知与规律记录反思卡',subtitle:'两页记录：先写我的理解，再写我的反思',symbol:'认知',picto:'认知',layout:'cognition-reflection',
    topics:[
      {
        no:'1',
        title:'攻克数理之难',
        desc:'从学科底层逻辑出发，数理天生有趣且有规律'
      },
      {
        no:'2',
        title:'支点数理四要素——一眼识题意',
        desc:'数字、字母、代数式、图形'
      },
      {
        no:'3',
        title:'支点数理三关系——重塑思维网络',
        desc:'是什么？是什么关系？生成什么关系？'
      },
      {
        no:'4',
        title:'搞定数学两大类型——横扫试卷',
        desc:'计算和应用'
      },
      {
        no:'5',
        title:'支点数学核心',
        desc:'知识点是打开数学大门的钥匙'
      }
    ]
  },
  {
    id:'management-checklist',num:'CHECK',title:'规划与管理执行 Checklist',subtitle:'逐项确认：我是否真的执行到位',symbol:'✓',picto:'✓',layout:'management-checklist',
    checks:['费曼达标','自我诊断','三级管理','定制教材','高效学习']
  },
  {
    id:'wake-thinking',num:'06',title:'唤醒思维模式',subtitle:'用 1·2·3·4 快速调动数学四要素',symbol:'1234',picto:'1234',
    flow:['1＝数字','2＝字母','3＝代数式','4＝图形','任意排列组合'],
    understand:'1、2、3、4 分别代表什么？不同顺序会让我想到什么？',
    example:[['我的1234对应','wide'],['我的排列组合',''],['它让我想到什么','']],
    checks:['我能记住1234对应的四要素','我能主动做不同排列组合','我能说出组合后想到的数学关系']
  },
  {
    id:'mindmap-method',num:'07',title:'知识导图画法',subtitle:'从中心主题出发，把知识关系画出来',symbol:'导图',picto:'导图',layout:'mindmap',
    flow:['看示例图','中心主题','向外发散','关键词/图形','保持清楚'],
    understand:'',example:[],checks:[]
  },
  {
    id:'point-point',num:'08',title:'点对点',subtitle:'一个知识点，对准它后面的一个小练习',symbol:'点→点',picto:'点点',
    flow:['先弄懂知识点','找到知识点后面的小练习','只用这个知识点精准练','做完检查是否真正会用'],
    understand:'我今天要练的是哪个知识点？它解决什么问题？',
    example:[['知识点','wide'],['对应小练习','wide'],['我是怎么用这个知识点的','wide']],
    checks:['我能先说清知识点再做题','我能找到与知识点直接对应的小练习','我能解释这道题用了哪个知识点']
  },
  {
    id:'point-face',num:'09',title:'点对面',subtitle:'一个知识点，去解决一组更综合的题',symbol:'点→面',picto:'点面',
    flow:['先弄懂知识点','找到单元/练习书后面的题型','用这个知识点去判断哪些题能解决','完成后总结它能覆盖哪些题型'],
    understand:'这个知识点能解决哪些类型的问题？',
    example:[['知识点','wide'],['单元/练习书题型','wide'],['这个知识点能解决的题','wide']],
    checks:['我能在一组题里识别何时用这个知识点','我能把同一知识点迁移到不同题型','我能总结这个知识点的适用范围']
  },

const $=id=>document.getElementById(id);
const toolMap=Object.fromEntries(TOOLS.map(t=>[t.id,t]));
function moduleNameForTool(toolId){
  const group=GROUPS.find(g=>g.tools.includes(toolId));
  return group ? group.name : '数学素养训练';
}
const STORE='pivot-math-toolbox-v2-3';

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function loadState(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch{return {}}}
function saveState(){
  const old=loadState();
  const selected=[...document.querySelectorAll('.tool-select:checked')].map(x=>x.value);
  const fields={...(old.fields||{})};
  document.querySelectorAll('[data-persist]').forEach(el=>{fields[el.dataset.persist]=el.type==='checkbox'?el.checked:el.value});
  localStorage.setItem(STORE,JSON.stringify({selected,fields}));
}

function renderModules(){
  const state=loadState();
  const selected=Array.isArray(state.selected)?state.selected:TOOLS.map(t=>t.id);
  $('moduleList').innerHTML=GROUPS.map(g=>`<section class="module">
    <div class="module-head"><div class="module-icon">${g.icon}</div><div><div class="module-code">${g.code}</div><div class="module-name">${g.name}</div></div></div>
    ${g.tools.map(id=>{const t=toolMap[id];return `<label class="tool-option">
      <input class="tool-select" type="checkbox" value="${id}" ${selected.includes(id)?'checked':''}>
      <span class="tool-picto">${esc(t.picto)}</span><span class="tool-text">${esc(t.title)}</span><span class="checkmark"></span>
    </label>`}).join('')}
  </section>`).join('');
}

function fieldHTML(t,label,wide,i){return `<div class="example-field ${wide==='wide'?'wide':''}"><label>${esc(label)}</label><textarea data-persist="${t.id}-ex-${i}" aria-label="${esc(label)}"></textarea></div>`}

function renderMindmapPage(t){
  return `<section class="page mindmap-page" data-tool="${t.id}">
    <header class="page-head">
      <div><div class="page-tag"><span class="dot"></span>MODULE ${esc(moduleNameForTool(t.id))} ${t.num}</div><h3 class="page-title">${esc(t.title)}</h3><div class="page-subtitle">${esc(t.subtitle)}</div></div>
    </header>
    <div class="content-grid">
      <section class="block flow-block">
        <div class="block-head"><span class="block-num">1</span><span class="block-title">我的动作流程</span><span class="block-note">先看示例，再自己画</span></div>
        <div class="mindmap-example">
          <div class="example-copy"><strong>示例图怎么读：</strong><br>中心主题 → 向外发散 → 一条线只放一个关键词/图形 → 同一级尽量保持清楚一致。</div>
          <img src="${MINDMAP_EXAMPLE}" alt="知识导图示例">
        </div>
      </section>
      <section class="block draw-block">
        <div class="block-head"><span class="block-num">2</span><span class="block-title">我来写（我的理解和我的示例）</span><span class="block-note">留足空间自己画</span></div>
        <div class="draw-area"></div>
      </section>
    </div>
    <div class="footer-note"><span>支点学习力 · 数学素养训练工具箱</span><strong>看懂 → 画出 → 讲清</strong></div>
  </section>`
}


function renderCognitionPage(t,topics,pageNo){
  const gridClass=topics.length===3?'three':'two';
  return `<section class="page cognition-page" data-tool="${t.id}" data-subpage="${pageNo}">
    <header class="page-head">
      <div>
        <div class="page-tag"><span class="dot"></span>MODULE 认知与规律 ${pageNo}/2</div>
        <h3 class="page-title">认知与规律｜记录反思卡</h3>
      </div>
    </header>
    <div class="content-grid">
      <section class="block cognition-write-block">
        <div class="block-head"><span class="block-num">1</span><span class="block-title">我来写：我的理解</span></div>
        <div class="cognition-topic-grid ${gridClass}">
          ${topics.map((x,i)=>`<div class="cognition-topic">
            <div class="cognition-topic-copy">
              <div class="cognition-topic-no">${esc(x.no)}</div>
              <div class="cognition-topic-title">${esc(x.title)}</div>
              <div class="cognition-topic-desc">${esc(x.desc)}</div>
            </div>
            <textarea data-persist="${t.id}-p${pageNo}-topic-${i}" aria-label="第${esc(x.no)}点我的理解" placeholder="我用自己的话写……"></textarea>
          </div>`).join('')}
        </div>
      </section>
      <section class="block cognition-reflect-block">
        <div class="block-head"><span class="block-num">2</span><span class="block-title">我的反思笔记</span></div>
        <div class="cognition-reflect-body">
          <textarea data-persist="${t.id}-p${pageNo}-reflection" aria-label="我的反思笔记" placeholder="我真正明白了什么？和之前不同的是？我会怎么做？"></textarea>
        </div>
      </section>
    </div>
    <div class="footer-note"><span>支点学习力 · 数学素养训练工具箱</span><strong>理解 → 写出 → 反思</strong></div>
  </section>`
}

function renderCognitionReflection(t){
  return renderCognitionPage(t,t.topics.slice(0,3),1)+renderCognitionPage(t,t.topics.slice(3,5),2);
}

function renderManagementChecklist(t){
  return `<section class="page checklist-page" data-tool="${t.id}">
    <header class="page-head">
      <div>
        <div class="page-tag"><span class="dot"></span>MODULE 规划与管理</div>
        <h3 class="page-title">我的自检表Checklist</h3>
        <div class="page-subtitle">今天是否都执行到位？</div>
      </div>
    </header>
    <div class="content-grid">
      <section class="block management-block">
        <div class="block-head"><span class="block-num">✓</span><span class="block-title">我的执行检查</span><span class="block-note">做到一项，勾选一项</span></div>
        <div class="management-checks">
          ${t.checks.map((c,i)=>`<label class="management-check">
            <input type="checkbox" data-persist="${t.id}-check-${i}">
            <span class="management-box"></span>
            <span class="management-name">${esc(c)}</span>
          </label>`).join('')}
        </div>
      </section>
    </div>
    <div class="footer-note"><span>支点学习力 · 数学素养训练工具箱</span><strong>计划清楚 → 执行到位</strong></div>
  </section>`
}

function renderPage(t){
  if(t.layout==='cognition-reflection') return renderCognitionReflection(t);
  if(t.layout==='management-checklist') return renderManagementChecklist(t);
  if(t.layout==='mindmap') return renderMindmapPage(t);
  return `<section class="page" data-tool="${t.id}">
    <header class="page-head">
      <div><div class="page-tag"><span class="dot"></span>MODULE ${esc(moduleNameForTool(t.id))} ${t.num}</div><h3 class="page-title">${esc(t.title)}</h3><div class="page-subtitle">${esc(t.subtitle)}</div></div>
    </header>
    <div class="content-grid">
      <section class="block flow-block">
        <div class="block-head"><span class="block-num">1</span><span class="block-title">我的动作流程</span></div>
        <div class="flow-track">${t.flow.map((x,i)=>`${i?'<span class="arrow">→</span>':''}<div class="flow-step"><span class="n">${i+1}</span><span class="t">${esc(x)}</span></div>`).join('')}</div>
      </section>
      <section class="block write-block">
        <div class="block-head"><span class="block-num">2</span><span class="block-title">我来写</span></div>
        <div class="write-body">
          <div class="write-card"><div class="write-label"><span class="pencil">✎</span>我的理解</div><div class="hint">${esc(t.understand)}</div><textarea data-persist="${t.id}-understand" aria-label="我的理解"></textarea></div>
          <div class="write-card"><div class="write-label"><span class="pencil">✎</span>我的示例</div><div class="hint">自己选一条知识点，按方法写出来。</div><div class="example-grid">${t.example.map((x,i)=>fieldHTML(t,x[0],x[1],i)).join('')}</div></div>
        </div>
      </section>
      <section class="block check-block">
        <div class="block-head"><span class="block-num">3</span><span class="block-title">我会了吗</span></div>
        <div class="check-inner">
          <div class="check-left">${t.checks.map((c,i)=>`<label class="check-item"><input type="checkbox" data-persist="${t.id}-check-${i}"><span class="check-box"></span><span class="check-text">${esc(c)}</span></label>`).join('')}</div>
          <div class="reflection-box"><div class="reflection-label">我的反思笔记</div><textarea data-persist="${t.id}-reflection" aria-label="我的反思笔记" placeholder="我哪里还不熟？下次要注意什么？"></textarea></div>
        </div>
      </section>
    </div>
    <div class="footer-note"><span>支点学习力 · 数学素养训练工具箱</span><strong>做过 → 写过 → 讲得清</strong></div>
  </section>`
}

function renderPages(){
  const selected=[...document.querySelectorAll('.tool-select:checked')].map(x=>x.value);
  $('counter').textContent=`已选 ${selected.length} 个工具`;
  $('selectionNote').textContent=selected.length?`已组合：${selected.map(id=>toolMap[id].title).join(' · ')}`:'还没有选择工具。';
  $('pages').innerHTML=selected.length?selected.map(id=>renderPage(toolMap[id])).join(''):`<div class="empty-state"><div class="big">🧩</div><strong>先在左侧勾选训练工具</strong>可以单选，也可以自由组合。</div>`;
  restoreFields();
}

function restoreFields(){
  const state=loadState();const fields=state.fields||{};
  document.querySelectorAll('[data-persist]').forEach(el=>{if(!(el.dataset.persist in fields))return;if(el.type==='checkbox')el.checked=!!fields[el.dataset.persist];else el.value=fields[el.dataset.persist]||''});
}

document.addEventListener('change',e=>{
  if(e.target.matches('.tool-select')){renderPages();saveState();return}
  if(e.target.matches('[data-persist]'))saveState();
});
document.addEventListener('input',e=>{if(e.target.matches('[data-persist]'))saveState()});
$('selectAllBtn').addEventListener('click',()=>{document.querySelectorAll('.tool-select').forEach(x=>x.checked=true);renderPages();saveState()});
$('clearSelectBtn').addEventListener('click',()=>{document.querySelectorAll('.tool-select').forEach(x=>x.checked=false);renderPages();saveState()});

renderModules();renderPages();
</script>
</body>
</html>
